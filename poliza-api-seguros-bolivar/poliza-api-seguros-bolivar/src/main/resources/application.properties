spring.application.name=poliza-api-seguros-bolivar
server.port=8080

# Postgres real (ver docker-compose.yml en la raiz del proyecto: docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:5432/polizasdb
spring.datasource.username=poliza_user
spring.datasource.password=poliza_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IPC usado para el incremento de canon/prima en la renovacion (configurable, no quemado en codigo)
poliza.renovacion.ipc=0.065

# API key esperada en el header "x-api-key" (ver ApiKeyInterceptor)
security.api-key=123456

# URL del mock del CORE (CoreMockController) que consume CoreIntegrationService.
# En un entorno real seria la URL de la capa media en WebLogic (Modulo 1, seccion 5).
core.mock.url=http://localhost:${server.port}/core-mock/evento

# Intervalo del publicador mock de notificaciones (NotificacionPublisher)
notificacion.publicador.intervalo-ms=5000

logging.level.com.segurosbolivar.polizaapi=INFO
